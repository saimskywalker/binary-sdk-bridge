name: binary_sdk_bridge
description: >-
  Generate a Flutter plugin that wraps a closed-source binary SDK — Swift
  Package Manager on iOS, a Gradle module on Android — with the vendor binary
  kept out of version control and optional at build time.
version: 0.1.0
repository: https://github.com/saimskywalker/binary-sdk-bridge

environment:
  sdk: ^3.5.0

dependencies:
  args: ^2.6.0
  path: ^1.9.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0

executables:
  binary-sdk-bridge: binary_sdk_bridge
